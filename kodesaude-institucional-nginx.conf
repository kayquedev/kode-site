# Kode Saúde — Site Institucional (kodesaude.com.br)
# Serve o site institucional diretamente, SEM redirecionamento para gestao
server {
    listen 443 ssl;
    server_name kodesaude.com.br www.kodesaude.com.br;

    root /var/www/kodesaude-site;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/kodesaude.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kodesaude.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 5m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Assets com hash no nome: cache longo
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Imagens e ícones
    location /images/ {
        expires 30d;
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 30d;
    }

    location = /icons.svg {
        expires 30d;
    }

    location = /robots.txt {
        expires 1d;
    }

    location = /sitemap.xml {
        expires 1d;
    }

    location = /index.html {
        expires -1;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name kodesaude.com.br www.kodesaude.com.br;
    return 301 https://kodesaude.com.br$request_uri;
}