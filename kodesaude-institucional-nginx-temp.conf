# Kode Saúde — Site Institucional (kodesaude.com.br)
# CONFIG TEMPORÁRIA: apenas HTTP para permitir certbot gerar o certificado
# Após o certbot rodar, esta config será substituída pela versão com SSL
server {
    listen 80;
    server_name kodesaude.com.br www.kodesaude.com.br;

    root /var/www/kodesaude-site;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}